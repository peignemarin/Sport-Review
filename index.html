<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sport Review — Track Record</title>
  <meta name="description" content="Every race I've run, traced on a map of France." />
  <link rel="stylesheet" href="css/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="topnav">
    <div class="container topnav-inner">
      <a class="brand" href="index.html">Sport Review</a>
      <div class="topnav-links">
        <a href="index.html" aria-current="page">Track Record</a>
        <a href="courses.html">Races</a>
      </div>
    </div>
  </nav>

  <main class="container page">
    <header class="tr-head">
      <h1 class="page-title">Track Record</h1>
    </header>

    <div id="counters" class="counters"></div>

    <div class="map-panel">
      <div id="map" class="map" aria-label="Map of France with race tracks"></div>
      <button id="map-reset" type="button" class="map-reset" hidden>← All of France</button>
      <div class="map-zoom" role="group" aria-label="Zoom">
        <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in (+)">+</button>
        <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out (−)">−</button>
      </div>
      <div id="map-legend" class="map-legend"></div>
      <div id="map-tip" class="map-tip" role="tooltip" hidden></div>
    </div>

    <h2 class="list-title">All races <span>most recent first</span></h2>
    <div id="race-filters" class="race-filters"></div>
    <ol id="race-list" class="race-list" aria-label="Races"></ol>
  </main>

  <script src="js/format.js"></script>
  <script src="js/vendor/leaflet.js"></script>
  <script src="js/basemap.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
